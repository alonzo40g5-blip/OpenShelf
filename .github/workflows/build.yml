name: build

# Compiles OpenShelf straight from the openshelf.zip in this repo.
#   1) Keep openshelf.zip in the repo root.
#   2) Keep THIS file at .github/workflows/build.yml.
#   3) One-time: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
# Results:
#   • android job -> downloadable APK under the run's "Artifacts"
#   • web job     -> live site on GitHub Pages (URL printed in the web job)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------- ANDROID
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (JDK 17 for Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project and build APK
        run: |
          set -e
          unzip -o openshelf.zip -d _extracted
          APP="$(dirname "$(find _extracted -type f -name capacitor.config.json | head -n1)")"
          echo "Android project: $APP"
          cd "$APP"
          npm install
          npm run sync-web
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --stacktrace)
          echo "APK_PATH=$APP/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenShelf-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

  # ---------------------------------------------------------------- WEB
  web:
    name: Deploy web app (GitHub Pages)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project and locate web app
        id: web
        run: |
          set -e
          unzip -o openshelf.zip -d _extracted
          WEB="$(dirname "$(find _extracted -type f -path '*/web/index.html' | head -n1)")"
          echo "Web app: $WEB"
          echo "dir=$WEB" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web app as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.web.outputs.dir }}

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
